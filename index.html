<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY // READING PLANNER</title>
<style>
:root {
  --bg: #000000;
  --text: #f0f0fa;
  --muted: #8888aa;
  --border: rgba(240, 240, 250, 0.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; letter-spacing: 0.4px; min-height: 100vh; }
.container { max-width: 720px; margin: 0 auto; padding: 1.5rem; }
header { text-align: center; margin-bottom: 1.5rem; }
h1 { font-size: 2.2rem; letter-spacing: 3px; text-transform: uppercase; }
.subtitle { color: var(--muted); letter-spacing: 2px; font-size: 0.8rem; margin-top: 0.3rem; }
nav { display: flex; gap: 0.6rem; justify-content: center; margin: 1.2rem 0; }
.nav-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 0.6rem 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
.nav-btn.active { background: var(--text); color: var(--bg); }
.view { display: none; }
.view.active { display: block; }
.date-header { text-align: center; font-size: 1.4rem; margin: 1rem 0; text-transform: uppercase; letter-spacing: 1px; }
.task-card { border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; }
.task-card h3 { text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-size: 0.95rem; }
.progress-bar { height: 3px; background: var(--border); margin: 0.6rem 0; }
.progress-fill { height: 100%; background: var(--text); }
.actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; align-items: center; flex-wrap: wrap; }
.actions input { width: 70px; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.35rem; text-align: center; }
button { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 0.45rem 0.9rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; font-size: 0.75rem; }
button:hover { background: rgba(240,240,250,0.1); }
label { display: block; margin: 0.8rem 0 0.3rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"] { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 0.6rem; }
.day-item { border-bottom: 1px solid var(--border); padding: 0.8rem 0; }
.small { font-size: 0.85rem; color: var(--muted); margin-left: 0.5rem; }
.page-range { color: #f0f0fa; font-weight: 500; margin: 0.3rem 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>MISSION CONTROL</h1>
    <p class="subtitle">READING & STUDY SCHEDULER</p>
  </header>
  <nav>
    <button class="nav-btn active" data-view="today">TODAY</button>
    <button class="nav-btn" data-view="calendar">CALENDAR</button>
    <button class="nav-btn" data-view="add">ADD</button>
  </nav>

  <section id="todayView" class="view active">
    <div class="date-header" id="todayDate"></div>
    <div id="todayTasks"></div>
  </section>

  <section id="calendarView" class="view">
    <div id="calendarDays"></div>
  </section>

  <section id="addView" class="view">
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
      <button class="nav-btn active" id="tabReading">독서</button>
      <button class="nav-btn" id="tabStudy">공부</button>
    </div>
    <form id="readingForm">
      <label>책 제목</label><input type="text" id="rTitle" required>
      <label>저자</label><input type="text" id="rAuthor">
      <label>시작 페이지</label><input type="number" id="rStart" required>
      <label>끝 페이지</label><input type="number" id="rEnd" required>
      <button type="submit" style="margin-top:1rem;">QUEUE BOOK</button>
    </form>
    <form id="studyForm" style="display:none;">
      <label>기본서 제목</label><input type="text" id="sTitle" required>
      <label>시작 페이지</label><input type="number" id="sStart" required>
      <label>끝 페이지</label><input type="number" id="sEnd" required>
      <label>회독 횟수</label><input type="number" id="sRounds" min="1" value="1" required>
      <label>종료일</label><input type="date" id="sEndDate" required>
      <label>시험일</label><input type="date" id="sExamDate">
      <label style="display:flex; align-items:center; gap:0.5rem;"><input type="checkbox" id="sTBD"> 미정</label>
      <button type="submit" style="margin-top:1rem;">REGISTER STUDY</button>
    </form>
  </section>
</div>

<script>
const KEY_R = 'readingQueue_v3';
const KEY_S = 'studies_v3';
const KEY_L = 'dailyLogs_v3';

let readingQueue = JSON.parse(localStorage.getItem(KEY_R) || '[]');
let studies = JSON.parse(localStorage.getItem(KEY_S) || '[]');
let dailyLogs = JSON.parse(localStorage.getItem(KEY_L) || '{}');

function save() {
  localStorage.setItem(KEY_R, JSON.stringify(readingQueue));
  localStorage.setItem(KEY_S, JSON.stringify(studies));
  localStorage.setItem(KEY_L, JSON.stringify(dailyLogs));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr() { return new Date().toISOString().split('T')[0]; }
function dateDiff(a, b) {
  return Math.ceil((new Date(b) - new Date(a)) / 86400000);
}

function getActiveReading() {
  const book = readingQueue.find(b => (b.pagesRead || 0) < (b.endPage - b.startPage + 1));
  if (book && !book.activeSince) {
    book.activeSince = todayStr();
    save();
  }
  return book;
}

function getReadingDailyTarget(asOf = todayStr()) {
  const book = getActiveReading();
  if (!book) return 0;
  const total = book.endPage - book.startPage + 1;
  const rem = total - (book.pagesRead || 0);
  if (rem <= 0) return 0;
  const elapsed = Math.max(0, dateDiff(book.activeSince || asOf, asOf));
  const daysLeft = Math.max(1, 14 - elapsed);
  return Math.ceil(rem / daysLeft);
}

function getReadingPageRange(asOf = todayStr()) {
  const book = getActiveReading();
  if (!book) return null;
  const target = getReadingDailyTarget(asOf);
  if (target <= 0) return null;
  const currentPage = book.startPage + (book.pagesRead || 0);
  const endPage = Math.min(currentPage + target - 1, book.endPage);
  return { start: currentPage, end: endPage, count: target };
}

function getStudyDailyTarget(study, asOf = todayStr()) {
  const totalWork = (study.endPage - study.startPage + 1) * (study.rounds || 1);
  const rem = Math.max(0, totalWork - (study.completedWork || 0));
  const daysLeft = Math.max(1, dateDiff(asOf, study.endDate));
  return Math.ceil(rem / daysLeft);
}

function getStudyPageRange(study, asOf = todayStr()) {
  const target = getStudyDailyTarget(study, asOf);
  if (target <= 0) return null;
  const pagesPerRound = study.endPage - study.startPage + 1;
  const completed = study.completedWork || 0;
  const pagesIntoCurrentRound = completed % pagesPerRound;
  const currentPage = study.startPage + pagesIntoCurrentRound;
  const endPage = Math.min(currentPage + target - 1, study.endPage);
  return { start: currentPage, end: endPage, count: target, round: Math.floor(completed / pagesPerRound) + 1 };
}

function logReading(pages) {
  const book = getActiveReading();
  if (!book || pages <= 0) return;
  book.pagesRead = (book.pagesRead || 0) + pages;
  const total = book.endPage - book.startPage + 1;
  if (book.pagesRead >= total) {
    book.pagesRead = total;
    book.completed = true;
  }
  const t = todayStr();
  if (!dailyLogs[t]) dailyLogs[t] = { reading: 0, studies: {} };
  dailyLogs[t].reading = (dailyLogs[t].reading || 0) + pages;
  save();
  renderAll();
}

function logStudy(id, pages) {
  const s = studies.find(x => x.id === id);
  if (!s || pages < 0) return;
  s.completedWork = (s.completedWork || 0) + pages;
  const t = todayStr();
  if (!dailyLogs[t]) dailyLogs[t] = { reading: 0, studies: {} };
  dailyLogs[t].studies[id] = (dailyLogs[t].studies[id] || 0) + pages;
  save();
  renderAll();
}

function undoToday(type, id) {
  const t = todayStr();
  if (!dailyLogs[t]) return;
  if (type === 'reading' && dailyLogs[t].reading) {
    const book = getActiveReading();
    if (book) book.pagesRead = Math.max(0, (book.pagesRead || 0) - dailyLogs[t].reading);
    dailyLogs[t].reading = 0;
  } else if (type === 'study' && id && dailyLogs[t].studies[id]) {
    const s = studies.find(x => x.id === id);
    if (s) s.completedWork = Math.max(0, (s.completedWork || 0) - dailyLogs[t].studies[id]);
    delete dailyLogs[t].studies[id];
  }
  save();
  renderAll();
}

function renderToday() {
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ko-KR', { weekday:'long', year:'numeric', month:'long', day:'numeric' }).toUpperCase();
  const el = document.getElementById('todayTasks');
  let html = '';

  const book = getActiveReading();
  const rRange = getReadingPageRange();
  html += '<div class="task-card"><h3>독서</h3>';
  if (readingQueue.length) {
    html += `<p class="small">대기열: ${readingQueue.map(b => b.completed ? b.title+'(완료)' : b.title).join(' → ')}</p>`;
  }
  if (book && rRange) {
    const total = book.endPage - book.startPage + 1;
    const pct = Math.round(((book.pagesRead||0)/total)*100);
    html += `<p>${book.title}${book.author ? ' — '+book.author : ''}</p>
             <p>진행 ${book.pagesRead||0} / ${total} (${pct}%)</p>
             <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
             <p class="page-range">오늘 목표: ${rRange.start} ~ ${rRange.end}페이지 (${rRange.count}p)</p>
             <div class="actions">
               <input type="number" id="rInput" min="0" value="${rRange.count}">
               <button data-action="log-reading">LOG</button>
               <button data-action="undo-reading">UNDO</button>
             </div>`;
  } else if (book) {
    html += `<p>${book.title} — 완료</p>`;
  } else {
    html += '<p>큐에 책이 없습니다.</p>';
  }
  html += '</div>';

  html += '<div class="task-card"><h3>공부</h3>';
  if (!studies.length) {
    html += '<p>등록된 기본서가 없습니다.</p>';
  } else {
    studies.forEach(s => {
      const range = getStudyPageRange(s);
      const totalWork = (s.endPage - s.startPage + 1) * (s.rounds || 1);
      const pct = Math.round(((s.completedWork||0)/totalWork)*100);
      const exam = s.examDate === '미정' ? '미정' : (s.examDate || '없음');
      html += `<div style="margin-bottom:1rem; padding-bottom:0.8rem; border-bottom:1px solid var(--border);">
        <p><strong>${s.title}</strong> (${s.rounds}회독)</p>
        <p>진행 ${s.completedWork||0} / ${totalWork} (${pct}%)</p>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      if (range) {
        html += `<p class="page-range">오늘 목표: ${range.start} ~ ${range.end}페이지 (${range.count}p) · ${range.round}회독</p>`;
      } else {
        html += `<p class="page-range">오늘 목표: 완료</p>`;
      }
      html += `<p class="small">종료 ${s.endDate} | 시험 ${exam}</p>
        <div class="actions">
          <input type="number" id="sInput_${s.id}" min="0" value="${range ? range.count : 0}">
          <button data-action="log-study" data-id="${s.id}">LOG</button>
          <button data-action="undo-study" data-id="${s.id}">UNDO</button>
        </div>
      </div>`;
    });
  }
  html += '</div>';
  el.innerHTML = html;

  el.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.action;
      if (act === 'log-reading') {
        const v = parseInt(document.getElementById('rInput').value) || 0;
        logReading(v);
      } else if (act === 'undo-reading') {
        undoToday('reading');
      } else if (act === 'log-study') {
        const id = btn.dataset.id;
        const v = parseInt(document.getElementById('sInput_'+id).value) || 0;
        logStudy(id, v);
      } else if (act === 'undo-study') {
        undoToday('study', btn.dataset.id);
      }
    };
  });
}

function renderCalendar() {
  const el = document.getElementById('calendarDays');
  let html = '';
  const start = new Date();
  for (let i = 0; i < 21; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const ds = d.toISOString().split('T')[0];
    const label = d.toLocaleDateString('ko-KR', { month:'short', day:'numeric', weekday:'short' });
    html += `<div class="day-item"><strong>${label.toUpperCase()}</strong>`;
    const book = getActiveReading();
    const rRange = getReadingPageRange(ds);
    if (book && rRange) html += `<div class="small">독서: ${book.title} ${rRange.start}~${rRange.end}p</div>`;
    studies.forEach(s => {
      const range = getStudyPageRange(s, ds);
      if (range) html += `<div class="small">공부: ${s.title} ${range.start}~${range.end}p</div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html || '<p>일정 없음</p>';
}

function renderAll() {
  renderToday();
  renderCalendar();
}

function setView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn[data-view]').forEach(b => b.classList.remove('active'));
  document.getElementById(name + 'View').classList.add('active');
  document.querySelector(`.nav-btn[data-view="${name}"]`).classList.add('active');
  if (name === 'calendar') renderCalendar();
}

document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
  btn.onclick = () => setView(btn.dataset.view);
});

document.getElementById('tabReading').onclick = () => {
  document.getElementById('readingForm').style.display = 'block';
  document.getElementById('studyForm').style.display = 'none';
  document.getElementById('tabReading').classList.add('active');
  document.getElementById('tabStudy').classList.remove('active');
};
document.getElementById('tabStudy').onclick = () => {
  document.getElementById('readingForm').style.display = 'none';
  document.getElementById('studyForm').style.display = 'block';
  document.getElementById('tabStudy').classList.add('active');
  document.getElementById('tabReading').classList.remove('active');
};

document.getElementById('readingForm').onsubmit = e => {
  e.preventDefault();
  readingQueue.push({
    id: uid(),
    title: document.getElementById('rTitle').value.trim(),
    author: document.getElementById('rAuthor').value.trim(),
    startPage: +document.getElementById('rStart').value,
    endPage: +document.getElementById('rEnd').value,
    pagesRead: 0,
    completed: false
  });
  save();
  e.target.reset();
  setView('today');
  renderAll();
};

document.getElementById('studyForm').onsubmit = e => {
  e.preventDefault();
  const exam = document.getElementById('sTBD').checked ? '미정' : (document.getElementById('sExamDate').value || null);
  studies.push({
    id: uid(),
    title: document.getElementById('sTitle').value.trim(),
    startPage: +document.getElementById('sStart').value,
    endPage: +document.getElementById('sEnd').value,
    rounds: +document.getElementById('sRounds').value || 1,
    endDate: document.getElementById('sEndDate').value,
    examDate: exam,
    completedWork: 0
  });
  save();
  e.target.reset();
  document.getElementById('sTBD').checked = false;
  setView('today');
  renderAll();
};

renderAll();
</script>
</body>
</html>
